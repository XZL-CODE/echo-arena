# 检查、测试；在 macOS 与 Windows 上打包桌面客户端并对打包结果跑端到端测试，
# 同时验证从源码用启动脚本运行；推送 v* 标签，或手动运行并填写版本号时发布 Release。
name: 构建与打包

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '要发布的版本号（如 v0.1.0）；留空只构建、不发布'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: 允许 Electron 沙盒（Ubuntu 24.04 默认限制非特权命名空间）
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: 端到端测试（Linux 客户端）
        run: xvfb-run -a npm run test:e2e
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-linux
          path: test-results/
          if-no-files-found: ignore

  package:
    name: 打包 ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
            unpacked: release/mac-universal
            files: release/*.dmg
          - name: Windows
            os: windows-latest
            script: dist:win
            unpacked: release/win-unpacked
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 打包
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 端到端测试（启动打包好的客户端）
        run: npx playwright test
        env:
          ECHO_ARENA_EXECUTABLE: ${{ matrix.unpacked }}
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: EchoArena-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.name }}
          path: test-results/
          if-no-files-found: ignore

  source:
    name: 从源码运行 ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 启动脚本首次运行（--check：装依赖、下载 Electron、构建，不开窗口）
        if: runner.os == 'macOS'
        run: bash ./启动游戏-macOS.command --check
      - name: 启动脚本首次运行（--check：装依赖、下载 Electron、构建，不开窗口）
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\启动游戏-Windows.cmd --check'
      - name: 冒烟测试（源码版客户端）
        run: npx playwright test tests/e2e/smoke.spec.ts

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
    needs: [package, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EchoArena-*
          path: artifacts
          merge-multiple: true
      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          # 推送标签时用标签名；手动运行时用填写的版本号，并在当前提交上新建标签。
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          gh release create "$TAG" * \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "回声竞技场 $TAG" \
            --notes "macOS 下载 .dmg（Apple 芯片与 Intel 通用）；Windows 下载 -win-setup.exe（安装版）或 -win-portable.exe（免安装）。安装包未签名，首次打开的办法、操作与玩法见 [README](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/README.md)。" \
            --generate-notes
