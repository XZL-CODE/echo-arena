# 检查、测试；在 macOS 与 Windows 上打包桌面客户端并对打包结果跑端到端测试，
# 同时验证从源码用启动脚本运行；合并到默认分支、推送 v* 标签或手动运行并填写版本号时发布 Release，
# 发布时给更新包签名并附上更新清单 latest.json（客户端据此自动更新）。
name: 构建与打包

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '要发布的版本号（如 v0.1.0）；留空只构建、不发布'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 检查与测试
    runs-on: ubuntu-latest
    # 时间上限约为平时的两倍：运行器卡住时尽早失败，不挂满默认的 6 小时
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: 核对更新签名密钥（用仓库 Secret 里的私钥签一个小文件，再用客户端内置的公钥核对）
        # 来自 fork 的 PR 拿不到 Secret，跳过
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-update.mjs --check-key
      - name: 允许 Electron 沙盒（Ubuntu 24.04 默认限制非特权命名空间）
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: 端到端测试（Linux 客户端）
        run: xvfb-run -a npm run test:e2e
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-linux
          path: test-results/
          if-no-files-found: ignore

  package:
    name: 打包 ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
            unpacked: release/mac-universal
            files: release/*.dmg
          - name: Windows
            os: windows-latest
            script: dist:win
            unpacked: release/win-unpacked
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    # 打包加端到端测试：Windows 平时约 22 分钟，macOS 约 7 分钟
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 打包
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 端到端测试（启动打包好的客户端）
        run: npx playwright test
        env:
          ECHO_ARENA_EXECUTABLE: ${{ matrix.unpacked }}
          # 包括真正替换安装的更新测试（装在临时目录；Windows 会写注册表，只在 CI 上跑）
          ECHO_ARENA_INSTALL_TEST: '1'
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: EchoArena-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.name }}
          path: test-results/
          if-no-files-found: ignore

  source:
    name: 从源码运行 ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 启动脚本首次运行（--check：装依赖、下载 Electron、构建，不开窗口）
        if: runner.os == 'macOS'
        run: bash ./启动游戏-macOS.command --check
      - name: 启动脚本首次运行（--check：装依赖、下载 Electron、构建，不开窗口）
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\启动游戏-Windows.cmd --check'
      - name: 冒烟测试（源码版客户端）
        run: npx playwright test tests/e2e/smoke.spec.ts

  release:
    name: 发布 Release
    # 三种情况发布：推送 v* 标签；手动运行并填写版本号；推送（合并）到默认分支，
    # 此时版本号取 package.json，这个版本已经发布过就跳过。
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(inputs.release, 'v') ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [package, source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # 读合并进来的 PR 正文（更新说明）
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: 确定版本号（这个版本已经发布过就跳过）
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          # 推送标签时用标签名；手动运行时用填写的版本号；推送到默认分支时为空，改用 package.json。
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
        run: |
          tag="${TAG:-v$(jq -r .version package.json)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "Release $tag 已存在，跳过。要发布新版本，先修改 package.json 里的 version。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$draft" = "true" ]; then
            echo "上次没发布完的草稿 $tag，删掉重新发布。"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
      - if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.tag.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: EchoArena-*
          path: artifacts
          merge-multiple: true
      - name: 取更新说明（合并进来的 PR 正文里的“更新内容”一节；没有就用自动生成的 PR 列表）
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p notes
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > notes/pr.md || true
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body > notes/generated.md
      - name: 给更新包签名，生成更新清单 latest.json 与 Release 正文
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-update.mjs --tag "$TAG" --artifacts artifacts --notes notes
      - name: 创建 Release，上传安装包与更新清单
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd artifacts
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          # 附件先传到草稿里，全部传完才公开：固定地址 releases/latest/download/latest.json
          # 在这之前一直指向上一个版本
          gh release create "$TAG" *.dmg *.exe SHA256SUMS.txt latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "回声竞技场 $TAG" \
            --notes-file ../notes/release.md \
            --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
